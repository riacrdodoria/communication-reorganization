" style="fill: #f8fafc; stroke: #cbd5e1; stroke-width: 0.8; stroke-linejoin: miter"/>
    </g>
    <text style="fill: #1f2937; font: 8.4px 'DejaVu Sans'" transform="translate(425.098128 327.226877)">Test  within-meeting Pearson r of each floor</text>
    <text style="fill: #1f2937; font: 8.4px 'DejaVu Sans'" transform="translate(406.233566 337.590443)">measure with %DET, then Wilcoxon signed-rank</text>
    <text style="fill: #1f2937; font: 8.4px 'DejaVu Sans'" transform="translate(442.133066 347.954009)">across meetings (n=34). 90 s windows.</text>
    <text style="fill: #1f2937; font: 8.4px 'DejaVu Sans'" transform="translate(430.115816 358.317574)">*participation entropy ≈ the state entropy</text>
    <text style="fill: #1f2937; font: 8.4px 'DejaVu Sans'" transform="translate(418.930691 368.68114)">(tautological sanity check), not independent.</text>
    <text style="fill: #1f2937; font: 8.4px 'DejaVu Sans'" transform="translate(391.807878 379.044706)">All effects strengthen at 300 s / between meetings.</text>
   </g>
  </g>
  <g id="text_22">
   <text style="fill: #6b7280; font: italic 8px 'DejaVu Sans'" transform="translate(8.902257 435.689953)">Figure 4. Casting the reorganization metrics in the vocabulary of the conversational floor (Edelsky 1981): measures of floor concentration — one dominant,</text>
   <text style="fill: #6b7280; font: italic 8px 'DejaVu Sans'" transform="translate(10.886632 444.648203)">central speaker (F1) — correlate positively with %DET (stable stretches), while floor breadth rises as %DET falls. Reorganization is the floor equalizing and</text>
   <text style="fill: #6b7280; font: italic 8px 'DejaVu Sans'" transform="translate(91.807882 453.606453)">de-centralizing (F1→F2). Bars = mean within-meeting r with %DET; *p&lt;.05, **p&lt;.01, ***p&lt;.001 (Wilcoxon, n=34).</text>
  </g>
 </g>
