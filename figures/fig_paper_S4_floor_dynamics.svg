    <text style="fill: #1f2937; font: 9px 'DejaVu Sans'; text-anchor: end" x="162.165937" y="377.557641" transform="rotate(-0 162.165937 377.557641)">Participation entropy*  r=-0.57 ***</text>
   </g>
   <g id="text_11">
    <text style="fill: #1f2937; font: 9px 'DejaVu Sans'; text-anchor: end" x="210.708791" y="329.511926" transform="rotate(-0 210.708791 329.511926)">Active speakers / window  r=-0.41 ***</text>
   </g>
   <g id="text_12">
    <text style="fill: #1f2937; font: 9px 'DejaVu Sans'; text-anchor: start" x="394.912023" y="281.466212" transform="rotate(-0 394.912023 281.466212)">Dyadic transition asymmetry  r=+0.17 ***</text>
   </g>
   <g id="text_13">
    <text style="fill: #1f2937; font: 9px 'DejaVu Sans'; text-anchor: start" x="397.331131" y="233.420498" transform="rotate(-0 397.331131 233.420498)">Network centralization  r=+0.18 ***</text>
   </g>
   <g id="text_14">
    <text style="fill: #1f2937; font: 9px 'DejaVu Sans'; text-anchor: start" x="407.470569" y="185.374783" transform="rotate(-0 407.470569 185.374783)">Participation Gini (words)  r=+0.21 ***</text>
   </g>
   <g id="text_15">
    <text style="fill: #1f2937; font: 9px 'DejaVu Sans'; text-anchor: start" x="427.143911" y="137.329069" transform="rotate(-0 427.143911 137.329069)">Eigenvector centrality  r=+0.28 ***</text>
   </g>
   <g id="text_16">
    <text style="fill: #1f2937; font: 9px 'DejaVu Sans'; text-anchor: start" x="428.775072" y="89.283355" transform="rotate(-0 428.775072 89.283355)">Turn-length dispersion (F1&gt;F2)  r=+0.28 ***</text>
   </g>
   <g id="text_17">
    <text style="fill: #1f2937; font: 9px 'DejaVu Sans'; text-anchor: start" x="499.207615" y="41.237641" transform="rotate(-0 499.207615 41.237641)">Top-speaker share  r=+0.51 ***</text>
   </g>
   <g id="text_18">
    <text style="fill: #2e7d8c; font: 700 9px 'DejaVu Sans'" transform="translate(160.980643 30.405437)">floor CONCENTRATION</text>
    <text style="fill: #2e7d8c; font: 700 9px 'DejaVu Sans'" transform="translate(160.204393 41.167328)">high when stable (F1);</text>
    <text style="fill: #2e7d8c; font: 700 9px 'DejaVu Sans'" transform="translate(157.508612 51.999531)">drops at reorganization</text>
   </g>
   <g id="text_19">
    <text style="fill: #d95f02; font: 700 9px 'DejaVu Sans'" transform="translate(460.231121 299.496594)">floor BREADTH</text>
    <text style="fill: #d95f02; font: 700 9px 'DejaVu Sans'" transform="translate(478.798543 310.258484)">rises at</text>
    <text style="fill: #d95f02; font: 700 9px 'DejaVu Sans'" transform="translate(448.607762 321.020375)">reorganization (F2)</text>
   </g>
   <g id="text_20">
    <text style="font: 700 11.5px 'DejaVu Sans'; text-anchor: start" x="150.478715" y="15.938203" transform="rotate(-0 150.478715 15.938203)">Study 4 — Reorganization is the floor opening (Edelsky F1 → F2)</text>
   </g>
   <g id="text_21">
    <g id="patch_5">
     <path d="M 391.807878 384.571643 
L 607.836191 384.571643 
