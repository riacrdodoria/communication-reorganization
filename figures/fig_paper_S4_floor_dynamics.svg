   <g id="text_10">
    <text style="fill: #1f2937; font: 9px 'DejaVu Sans'; text-anchor: end" x="162.165938" y="377.557641" transform="rotate(-0 162.165938 377.557641)">Participation entropy*  r=-0.57 ***</text>
   </g>
   <g id="text_11">
    <text style="fill: #1f2937; font: 9px 'DejaVu Sans'; text-anchor: end" x="209.751842" y="329.511926" transform="rotate(-0 209.751842 329.511926)">Active speakers / window  r=-0.42 ***</text>
   </g>
   <g id="text_12">
    <text style="fill: #1f2937; font: 9px 'DejaVu Sans'; text-anchor: start" x="374.478462" y="281.466212" transform="rotate(-0 374.478462 281.466212)">Network centralization  r=+0.10 **</text>
   </g>
   <g id="text_13">
    <text style="fill: #1f2937; font: 9px 'DejaVu Sans'; text-anchor: start" x="384.376045" y="233.420498" transform="rotate(-0 384.376045 233.420498)">Eigenvector centrality  r=+0.13 ***</text>
   </g>
   <g id="text_14">
    <text style="fill: #1f2937; font: 9px 'DejaVu Sans'; text-anchor: start" x="406.939054" y="185.374783" transform="rotate(-0 406.939054 185.374783)">Participation Gini (words)  r=+0.21 ***</text>
   </g>
   <g id="text_15">
    <text style="fill: #1f2937; font: 9px 'DejaVu Sans'; text-anchor: start" x="428.711017" y="137.329069" transform="rotate(-0 428.711017 137.329069)">Turn-length dispersion (F1&gt;F2)  r=+0.28 ***</text>
   </g>
   <g id="text_16">
    <text style="fill: #1f2937; font: 9px 'DejaVu Sans'; text-anchor: start" x="445.403286" y="89.283355" transform="rotate(-0 445.403286 89.283355)">In–out influence asymmetry  r=+0.34 ***</text>
   </g>
   <g id="text_17">
    <text style="fill: #1f2937; font: 9px 'DejaVu Sans'; text-anchor: start" x="499.654281" y="41.237641" transform="rotate(-0 499.654281 41.237641)">Top-speaker share  r=+0.52 ***</text>
   </g>
   <g id="text_18">
    <text style="fill: #2e7d8c; font: 700 9px 'DejaVu Sans'" transform="translate(162.018143 30.405437)">floor CONCENTRATION</text>
    <text style="fill: #2e7d8c; font: 700 9px 'DejaVu Sans'" transform="translate(161.241893 41.167328)">high when stable (F1);</text>
    <text style="fill: #2e7d8c; font: 700 9px 'DejaVu Sans'" transform="translate(158.546112 51.999531)">drops at reorganization</text>
   </g>
   <g id="text_19">
    <text style="fill: #d95f02; font: 700 9px 'DejaVu Sans'" transform="translate(460.006022 299.496594)">floor BREADTH</text>
    <text style="fill: #d95f02; font: 700 9px 'DejaVu Sans'" transform="translate(478.573444 310.258484)">rises at</text>
    <text style="fill: #d95f02; font: 700 9px 'DejaVu Sans'" transform="translate(448.382662 321.020375)">reorganization (F2)</text>
   </g>
   <g id="text_20">
    <text style="font: 700 11.5px 'DejaVu Sans'; text-anchor: start" x="151.81814" y="15.938203" transform="rotate(-0 151.81814 15.938203)">Study 4 — Reorganization is the floor opening (Edelsky F1 → F2)</text>
   </g>
   <g id="text_21">
    <g id="patch_5">
     <path d="M 391.08666 384.571643 
L 607.114973 384.571643 
